name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GCP_PROJECT_ID: notely-493712
      GCP_REGION: us-central1
      SERVICE_NAME: notely
      IMAGE_REPOSITORY: notely-ar-repo
      IMAGE_NAME: notely-image
      IMAGE_URI: us-central1-docker.pkg.dev/notely-493712/notely-ar-repo/notely-image:latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: 'notely-493712'
          workload_identity_provider: 'projects/607359912193/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'cloud-run-deployer@notely-493712.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'

      - name: Configure gcloud project
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud config set run/region "$GCP_REGION"

      - name: Verify required Google Cloud APIs
        run: |
          for api in run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com; do
            if ! gcloud services list --enabled --filter="config.name=${api}" --format="value(config.name)" | grep -qx "${api}"; then
              echo "Required API is not enabled: ${api}"
              exit 1
            fi
          done

      - name: Verify Cloud Run and Artifact Registry configuration
        run: |
          echo "Using project: $GCP_PROJECT_ID"
          echo "Using region: $GCP_REGION"
          echo "Deploying image: $IMAGE_URI"
          gcloud --version
          gcloud config list
          gcloud run regions list --format="value(locationId)" | grep -qx "$GCP_REGION"
          gcloud artifacts repositories describe "$IMAGE_REPOSITORY" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format="yaml(name,format,location)"
          gcloud run services list \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format="value(metadata.name)" >/dev/null

      - name: Build and push image with Cloud Build
        run: |
          gcloud builds submit \
            --tag "$IMAGE_URI" .

      - name: Run database migrations
        run: npm run db:migrate

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE_URI" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --project "$GCP_PROJECT_ID" \
            --max-instances=4
