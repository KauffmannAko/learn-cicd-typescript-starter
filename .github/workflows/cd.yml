name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: notely-493712
      GCP_REGION: us-central1
      SERVICE_NAME: notely
      IMAGE_REPOSITORY: notely-ar-repo
      IMAGE_NAME: notely-image

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/607359912193/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'cloud-run-deployer@notely-493712.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'

      - name: Configure gcloud project
        run: gcloud config set project "$GCP_PROJECT_ID"

      - name: Verify required Google Cloud APIs
        run: |
          for api in run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com; do
            if ! gcloud services list --enabled --filter="config.name=${api}" --format="value(config.name)" | grep -qx "${api}"; then
              echo "Required API is not enabled: ${api}"
              exit 1
            fi
          done

      - name: Build and push image with Cloud Build
        run: |
          gcloud builds submit \
            --tag ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/${IMAGE_NAME}:latest .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/${IMAGE_NAME}:latest \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --project "$GCP_PROJECT_ID" \
            --max-instances=4
